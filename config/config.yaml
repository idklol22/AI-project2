# ============================================================
# Predictive Maintenance — Configuration
# ============================================================

data:
  num_samples: 20000
  sample_length: 4096        # raw signal length before feature extraction
  sampling_rate: 10000       # Hz
  snr_range: [5, 30]         # dB — low end simulates harsh noise
  output_csv: "data/synthetic_vibration_data.csv"
  random_seed: 42

  # machine fleet
  machines:
    - CAT-EX-001
    - CAT-EX-002
    - CAT-TB-001
    - CAT-TB-002
    - CAT-DZ-001

model:
  num_features: 16             # 15 vibration + 1 machine_id_encoded
  cnn_channels: [32, 64, 128]
  cnn_kernel_sizes: [7, 5, 3]
  lstm_hidden: 128
  lstm_layers: 1
  bidirectional: true
  dropout: 0.3
  num_classes: 8             # 8 fault classes

training:
  batch_size: 128
  epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stop_patience: 8
  val_split: 0.2
  checkpoint_dir: "models/"
  log_dir: "runs/"

export:
  onnx_path: "models/fault_detector.onnx"
  opset_version: 14

email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  use_tls: true
  username: "your_email@gmail.com"
  password: "your_app_password"
  from_address: "predictive.maintenance@caterpillar.com"
  recipients:
    - maintainer1@example.com
    - maintainer2@example.com
  subject_prefix: "[FAULT ALERT]"
